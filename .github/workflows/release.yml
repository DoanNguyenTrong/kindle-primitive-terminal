name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    uses: DoanNguyenTrong/kindle-primitive-build/.github/workflows/package.yml@9533d481058f4d67b29568f40b30017ddcb32c8e
    permissions:
      contents: write
    with:
      id: primitive-terminal
      dir: terminal
      binary-crate: kt-kindle
      arches: armhf,armel
      firmware-min: "5.16.3"
      docs-licence-file: LICENSE-DOCS
