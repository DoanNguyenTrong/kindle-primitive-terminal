[workspace]
resolver = "2"
members = ["crates/kt-engine", "crates/kt-core", "crates/kt-render", "crates/kt-kindle", "crates/kt-desktop"]

[workspace.package]
version = "0.1.10"
edition = "2021"
license = "AGPL-3.0-only"

[workspace.dependencies]
# Same pinned versions as Primitive Browser and Primitive Launcher, so the offline crate cache has them.
vello_cpu = { version = "0.3", default-features = false, features = ["std", "text", "u8_pipeline"] }
parley = { version = "=0.12.0", default-features = false, features = ["std"] }
png = "0.17"
libc = "0.2"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "unwind"
